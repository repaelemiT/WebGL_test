<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Isla-Roleplay</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111318; overflow: hidden; }
      #unity-container { position: relative; width: 100%; height: 100%; }
      /* touch-action: none 防止 iOS 触摸滚动/双击缩放干扰按住说话按钮 */
      #unity-canvas { display: block; width: 100%; height: 100%; background: #111318; touch-action: none; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 240px; height: 8px; background: #2a2e35; border-radius: 4px; overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: #4a90d9; border-radius: 4px; transition: width .15s; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar"><div id="unity-progress-bar-full"></div></div>
    </div>
    <script>
      // ==== 音频解锁（必须先于 Unity loader 执行）====
      // 浏览器 autoplay policy 会把 AudioContext 冻结在 suspended，直至"手势同步栈"内
      // 的 resume。Unity 引擎自身的 resume 走帧循环（异步），在 iOS Safari 上过不了
      // 手势栈检查 → 首次访问整页无声（背景音乐也没有）。这里 wrap AudioContext 构造器
      // 捕获 Unity 创建的 context，在 DOM 手势监听器（同步栈）里 resume + 启动静音
      // buffer（iOS 严格模式的标准解锁仪式），一次性完成解锁。
      (function () {
        var RealCtx = window.AudioContext || window.webkitAudioContext;
        if (!RealCtx) return;
        var realContext = null;
        function WrappedCtx() { realContext = new RealCtx(); return realContext; }
        WrappedCtx.prototype = RealCtx.prototype;   // 保持 instanceof 语义
        try {
          window.AudioContext = WrappedCtx;
          if (window.webkitAudioContext) window.webkitAudioContext = WrappedCtx;
        } catch (e) { return; }

        var unlocked = false;
        function unlock() {
          if (unlocked || !realContext) return;   // context 未创建时不置位，等下一次手势
          unlocked = true;
          try {
            if (realContext.state === 'suspended') realContext.resume();
            var buf = realContext.createBuffer(1, 1, 22050);
            var src = realContext.createBufferSource();
            src.buffer = buf;
            src.connect(realContext.destination);
            src.start(0);
          } catch (e) { /* 极端环境（浏览器禁音频等）忽略，退回引擎自身机制 */ }
        }
        ['pointerdown', 'touchstart', 'touchend', 'click', 'keydown'].forEach(function (name) {
          document.addEventListener(name, unlock, { capture: true, passive: true });
        });
      })();

      // ==== Unity 启动 ====
      var canvas = document.getElementById('unity-canvas');
      var progressBarFull = document.getElementById('unity-progress-bar-full');
      var loadingBar = document.getElementById('unity-loading-bar');

      var config = {
        dataUrl: 'Build/WebGL_v3.data.unityweb',
        frameworkUrl: 'Build/WebGL_v3.framework.js.unityweb',
        codeUrl: 'Build/WebGL_v3.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "SlipperSoar Studio",
        productName: "Isla-Roleplay",
        productVersion: "0.2",
        showBanner: function () { /* 空实现：静音"移动端不支持"等横幅 */ },
      };

      var script = document.createElement('script');
      script.src = 'Build/WebGL_v3.loader.js';
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (progress * 100) + '%';
        }).then(function () {
          loadingBar.style.display = 'none';
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>

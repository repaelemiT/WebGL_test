<!DOCTYPE html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- 注意：刻意不加 viewport meta（官方 Default 也没有）。
         加了 width=device-width 后，手机 layout viewport 从默认 980px 缩到设备实际宽度
         （约 390px），叠加 devicePixelRatio=1，渲染 buffer 从 980×~2000 掉到 390×844，
         拉伸到全屏即糊——这正是上一版"移动端分辨率下降"的根因。
         无 viewport 时 buffer 更大、页面整体缩小显示，等于超采样，反而清晰。 -->
    <title>Isla-Roleplay</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!-- 容器结构 = 官方 Default 模板（2020.3）：桌面端 container 绝对定位居中（style.css
         .unity-desktop 的 left/top 50% + translate），移动端撑满视口。
         此前 Isla 模板用 flex 居中一个 100%×100% 的 container（等于没居中），
         canvas 固定 px 后静态定位落在视口左上角——"场景在左上角、四周全黑"即此。 -->
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Isla-Roleplay</div>
      </div>
    </div>
    <script>
      // ==== 音频解锁（必须先于 Unity loader 执行）====
      // 浏览器 autoplay policy 会把 AudioContext 冻结在 suspended，直至"手势同步栈"内
      // 的 resume。Unity 引擎自身的 resume 走帧循环（异步），在 iOS Safari 上过不了
      // 手势栈检查 → 首次访问整页无声（背景音乐也没有）。这里 wrap AudioContext 构造器
      // 捕获 Unity 创建的 context，在 DOM 手势监听器（同步栈）里 resume + 启动静音
      // buffer（iOS 严格模式的标准解锁仪式），一次性完成解锁。
      // 注意：wrap 必须捕获 Unity 的 context 而非自建 —— 麦克风插件(bnco)的
      // InitOrResumeContext 对"自建 ctx 挂起"会持续返回 false（getUserMedia 需要
      // running 状态的 context），那正是"首次进入无法录音、刷新后恢复"的机制。
      (function () {
        var RealCtx = window.AudioContext || window.webkitAudioContext;
        if (!RealCtx) return;
        var realContext = null;
        function WrappedCtx() { realContext = new RealCtx(); return realContext; }
        WrappedCtx.prototype = RealCtx.prototype;   // 保持 instanceof 语义
        try {
          window.AudioContext = WrappedCtx;
          if (window.webkitAudioContext) window.webkitAudioContext = WrappedCtx;
        } catch (e) { return; }

        var unlocked = false;
        function unlock() {
          if (unlocked || !realContext) return;   // context 未创建时不置位，等下一次手势
          unlocked = true;
          try {
            if (realContext.state === 'suspended') realContext.resume();
            var buf = realContext.createBuffer(1, 1, 22050);
            var src = realContext.createBufferSource();
            src.buffer = buf;
            src.connect(realContext.destination);
            src.start(0);
          } catch (e) { /* 极端环境（浏览器禁音频等）忽略，退回引擎自身机制 */ }
        }
        ['pointerdown', 'touchstart', 'touchend', 'click', 'keydown'].forEach(function (name) {
          document.addEventListener(name, unlock, { capture: true, passive: true });
        });
      })();

      // ==== Unity 启动（官方 Default 结构，showBanner 精简）====
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      var config = {
        dataUrl: 'Build/WebGL_v21.data.unityweb',
        frameworkUrl: 'Build/WebGL_v21.framework.js.unityweb',
        codeUrl: 'Build/WebGL_v21.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "SlipperSoar Studio",
        productName: "Isla-Roleplay",
        productVersion: "0.4",
        showBanner: function () { /* 空实现：静音"移动端不支持"等横幅（产品决策，官方 unityShowBanner 不引入） */ },
      };

      // 与官方 Default 一致的画布策略：
      // - 移动端 UA：devicePixelRatio = 1（官方注释：避免高 DPR 拖垮填充率），
      //   canvas CSS 撑满视口，渲染目标 = 视口 CSS 像素（matchWebGLToCanvasSize 默认开启）；
      // - 桌面：canvas DOM 尺寸锁定为 Player Settings 的固定分辨率（960×600），
      //   container 由 style.css 绝对定位居中；渲染目标 = DOM 尺寸 × 设备 DPR（高清屏自然高清）。
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }
      // 官方 Default 原生背景图机制：Player Settings 勾选 Splash Image → WebGL 后，
      // 构建时会把背景图输出为 Build/<构建名>.jpg 并在加载期间铺在 canvas 上
      // （center/cover）。构建产物里已有 <构建名>.jpg，说明该配置已开启，恢复此分支即生效。
      canvas.style.background = "url('" + "Build/WebGL_v21.jpg') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement('script');
      script.src = 'Build/WebGL_v21.loader.js';
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (progress * 100) + '%';
        }).then(function (unityInstance) {
          loadingBar.style.display = 'none';
          // 全屏按钮（官方 Default 同款交互；移动端 footer 由 style.css 隐藏）
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };

          // ==== 全屏渲染负载控制 ====
          // 实测（F12）：窗口 buffer 1440×900（CSS 960×600 × dpr1.5，≈1.3M px/帧）流畅；
          // 全屏 CSS 1699×1062 × dpr1.5 → buffer 2549×1593（≈4.1M px/帧），像素量 3.1 倍
          // → 模型动作掉帧。framework.js 已确认引擎每次 resize 实时读取 Module.devicePixelRatio，
          // 故进入全屏时把它降到 FULLSCREEN_DPR、退出还原，再手动补发一次 window resize
          // 让引擎按新 DPR 重算 buffer（浏览器自身的 resize 可能先于 fullscreenchange，不可依赖）。
          // 本机 FULLSCREEN_DPR=1 时全屏 buffer≈1.8M px，流畅；若全屏画质嫌软可上调至 1.25 折中。
          var FULLSCREEN_DPR = 1;
          var windowDPR = window.devicePixelRatio || 1;
          document.addEventListener('fullscreenchange', function () {
            var isFs = !!document.fullscreenElement;
            unityInstance.devicePixelRatio = isFs ? FULLSCREEN_DPR : windowDPR;
            setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 0);
          });
        }).catch(function (message) {
          // 加载失败要有提示（官方 Default 同款），避免用户面对黑屏无反馈
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
